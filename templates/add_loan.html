
{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
<div class="row">
<div class="col-md-8 mx-auto">
<div class="card shadow">
<div class="card-header bg-warning fw-bold">Add Loan</div>
<div class="card-body">
<form action="{{ url_for('add_loan') }}" method="POST">
<div class="mb-3">
<label for="member_id" class="form-label">Member</label>
<select name="member_id" id="member_id" class="form-select" required>
{% for member in members %}
<option value="{{ member.id }}">{{ member.name }}</option>
{% endfor %}
</select>
</div>
<div class="mb-3">
<label for="loan_type" class="form-label">Loan Type</label>
<select name="loan_type" id="loan_type" class="form-select" required>
<option value="" disabled selected>Select loan type</option>
<option value="Emergency">Emergency</option>
<option value="Personal">Personal</option>
<option value="Business">Business</option>
<option value="Education">Education</option>
<option value="Medical">Medical</option>
</select>
</div>
<div class="mb-3">
<label for="principal" class="form-label">Principal (KES)</label>
<input type="number" step="0.01" name="principal" id="principal" class="form-control" required>
</div>
<div class="mb-3">
<label for="interest_rate" class="form-label">Interest Rate (e.g., 0.05)</label>
<input type="number" step="0.01" name="interest_rate" id="interest_rate" class="form-control" required>
</div>
<div class="mb-3">
<label for="repayment_period" class="form-label">Repayment Period (months)</label>
<input type="number" name="repayment_period" id="repayment_period" class="form-control" required>
</div>
<div class="mb-3">
<label for="date" class="form-label">Loan Date</label>
<input type="date" name="date" id="date" class="form-control" required>
</div>
<div class="d-grid">
<button type="submit" class="btn btn-warning">
<i class="fas fa-plus"></i> Add Loan
</button>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
{% endblock %}
