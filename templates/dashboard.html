<!-- Chart -->
<div class="card shadow mb-4">
    <div class="card-header bg-info text-white fw-bold">Contributions vs Loans</div>
    <div class="card-body text-center d-flex justify-content-center">
        <canvas id="contributionLoanChart" style="max-width: 700px; max-height: 500px;"></canvas>
    </div>
</div>

<!-- Chart.js Script -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const chartLabels = {{ chart_labels|tojson }};
    const contributionsData = {{ contributions_data|tojson }};
    const loansData = {{ loans_data|tojson }};

    if (chartLabels.length > 0) {
        const ctx = document.getElementById('contributionLoanChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: chartLabels,
                datasets: [
                    {
                        label: 'Contributions',
                        data: contributionsData,
                        backgroundColor: '#4CAF50'
                    },
                    {
                        label: 'Loans',
                        data: loansData,
                        backgroundColor: '#FF9800'
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return 'Ksh ' + value.toLocaleString('en-KE');
                            }
                        }
                    }
                },
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const value = context.parsed.y;
                                return context.dataset.label + ': Ksh ' + value.toLocaleString('en-KE', { minimumFractionDigits: 2 });
                            }
                        }
                    }
                }
            }
        });
    }
</script>
