{% extends "base.html" %}
{% block content %}

<div class="card shadow"> <div class="card-header bg-secondary text-white fw-bold">Repay Loan</div> <div class="card-body"> <form action="{{ url_for('repay_loan') }}" method="POST"> <div class="mb-3"> <label for="loan_id" class="form-label">Select Loan</label> <select name="loan_id" id="loan_id" class="form-select" required> {% for loan in loans %} <option value="{{ loan.id }}">{{ loan.member.name }} - KES {{ loan.principal }}</option> {% endfor %} </select> </div>

        <div class="mb-3">
            <label for="amount_paid" class="form-label">Amount Paid (KES)</label>
            <input type="number" name="amount_paid" id="amount_paid" step="0.01" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="date" class="form-label">Repayment Date</label>
            <input type="date" name="date" id="date" class="form-control" required>
        </div>


        <div class="d-grid">
            <button type="submit" class="btn btn-secondary">
                <i class="fas fa-money-bill-wave"></i> Record Repayment
            </button>
        </div>
    </form>
</div>

</div> {% endblock %}
