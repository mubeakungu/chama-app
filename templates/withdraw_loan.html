{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
<div class="row">
<div class="col-md-8 mx-auto">
<div class="card shadow">
<div class="card-header bg-info text-white fw-bold">Withdraw Loan</div>
<div class="card-body">
<form action="{{ url_for('withdraw_loan') }}" method="POST">
<div class="mb-3">
<label for="loan_id" class="form-label">Select Loan</label>
<select name="loan_id" id="loan_id" class="form-select" required>
{% for loan in loans %}
<option value="{{ loan.id }}">{{ loan.member.name }} — KES {{ "%.2f"|format(loan.principal) }}</option>
{% endfor %}
</select>
</div>
<div class="mb-3">
<label for="amount" class="form-label">Amount Disbursed (KES)</label>
<input type="number" step="0.01" name="amount" id="amount" class="form-control" required>
</div>
<div class="mb-3">
<label for="disbursed_date" class="form-label">Disbursed Date</label>
<input type="date" name="disbursed_date" id="disbursed_date" class="form-control" required>
</div>
<div class="d-grid">
<button type="submit" class="btn btn-info"><i class="fas fa-arrow-down"></i> Record Withdrawal</button>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
{% endblock %}
